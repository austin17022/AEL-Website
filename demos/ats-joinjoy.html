<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>JOINJOY ATS ｜ 獵頭作業系統 Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0D1B2A; --ink-2:#16263a; --ink-3:#1e3350;
  --blue:#2446A8; --blue-d:#1F4E8C; --blue-l:#6E9BE0; --blue-50:#EEF3FC;
  --bg:#F7F9FC; --card:#fff; --line:#E3E9F2; --line-2:#CBD5E1;
  --txt:#1A2433; --txt-2:#5A6B85; --txt-3:#8A99B0;
  --ok:#0F9D6E; --ok-bg:#E8F7F1; --warn:#D97706; --warn-bg:#FEF3E2;
  --dang:#DC2626; --dang-bg:#FEE9E9; --purple:#7C3AED; --purple-bg:#F1EBFE;
  --r:10px; --sh:0 1px 2px rgba(13,27,42,.06), 0 4px 16px rgba(13,27,42,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
svg{width:16px;height:16px;flex-shrink:0;display:inline-block;vertical-align:-3px}
html,body{height:100%}
body{
  font-family:'Inter','Noto Sans TC',-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg); color:var(--txt); font-size:14px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:inherit}
a{color:inherit;text-decoration:none}

/* ===== Layout ===== */
.app{display:flex;min-height:100vh}
.side{
  width:232px;flex-shrink:0;background:var(--ink);color:#fff;
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
}
.brand{padding:20px 18px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand-mk{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--blue) 0%,var(--blue-l) 100%);display:grid;place-items:center;font-weight:700;font-size:15px;letter-spacing:-.5px}
.brand-tx b{display:block;font-size:14px;font-weight:700;letter-spacing:.2px}
.brand-tx span{display:block;font-size:10.5px;color:#8FA6C4;letter-spacing:1.2px;text-transform:uppercase}
.nav{flex:1;padding:12px 10px;overflow-y:auto}
.nav-lbl{font-size:10.5px;color:#6E819C;letter-spacing:1px;text-transform:uppercase;padding:14px 10px 6px;font-weight:600}
.nav-i{
  display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;
  color:#C3D0E2;font-size:13.5px;font-weight:500;width:100%;text-align:left;margin-bottom:1px;
  transition:.15s;
}
.nav-i:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-i.on{background:var(--blue);color:#fff}
.nav-i svg{width:17px;height:17px;flex-shrink:0;opacity:.9}
.nav-i.lock{opacity:.32;cursor:not-allowed}
.nav-i.lock:hover{background:none;color:#C3D0E2}
.nav-i .cnt{margin-left:auto;font-size:11px;background:rgba(255,255,255,.14);padding:1px 7px;border-radius:20px;font-weight:600}
.nav-i.on .cnt{background:rgba(255,255,255,.25)}
.side-ft{padding:12px;border-top:1px solid rgba(255,255,255,.08)}
.role-box{background:rgba(255,255,255,.05);border-radius:8px;padding:10px}
.role-box label{font-size:10.5px;color:#8FA6C4;letter-spacing:.5px;display:block;margin-bottom:6px;font-weight:600}
.role-box select{
  width:100%;background:var(--ink-3);color:#fff;border:1px solid rgba(255,255,255,.14);
  border-radius:6px;padding:6px 8px;font-size:12.5px;
}
.role-hint{font-size:10.5px;color:#7E93B0;margin-top:7px;line-height:1.5}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{
  height:60px;background:#fff;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:16px;padding:0 24px;position:sticky;top:0;z-index:20;
}
.search{flex:1;max-width:440px;position:relative}
.search input{
  width:100%;height:36px;border:1px solid var(--line);border-radius:8px;
  padding:0 12px 0 36px;background:var(--bg);outline:none;transition:.15s;
}
.search input:focus{border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px var(--blue-50)}
.search svg{position:absolute;left:11px;top:10px;width:16px;height:16px;color:var(--txt-3)}
.top-sp{flex:1}
.top-btn{display:flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:8px;font-size:13px;font-weight:500;color:var(--txt-2);border:1px solid var(--line)}
.top-btn:hover{background:var(--bg)}
.top-btn.pri{background:var(--blue);color:#fff;border-color:var(--blue)}
.top-btn.pri:hover{background:var(--blue-d)}
.top-btn svg{width:15px;height:15px}
.me{display:flex;align-items:center;gap:9px;padding-left:16px;border-left:1px solid var(--line)}
.ava{width:32px;height:32px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:12.5px;font-weight:600}
.me-tx b{display:block;font-size:13px;line-height:1.3}
.me-tx span{display:block;font-size:11px;color:var(--txt-3)}

.wrap{padding:24px;flex:1}
.page{display:none;animation:fade .22s ease}
.page.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.ph{display:flex;align-items:flex-end;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.ph h1{font-size:22px;font-weight:700;letter-spacing:-.3px;line-height:1.3}
.ph p{color:var(--txt-2);font-size:13px;margin-top:2px}
.ph-sp{flex:1}

/* ===== Cards ===== */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.card-h{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.card-h h3{font-size:14.5px;font-weight:600}
.card-h .sp{flex:1}
.card-b{padding:18px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:1200px){.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:900px){.g3,.g2{grid-template-columns:1fr}}

/* KPI */
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh)}
.kpi .lb{font-size:12px;color:var(--txt-2);font-weight:500;display:flex;align-items:center;gap:6px}
.kpi .lb svg{width:14px;height:14px;color:var(--blue)}
.kpi .vl{font-size:27px;font-weight:700;letter-spacing:-.8px;margin-top:6px;line-height:1.1}
.kpi .dl{font-size:11.5px;margin-top:5px;display:flex;align-items:center;gap:4px;color:var(--txt-3)}
.up{color:var(--ok);font-weight:600}
.dn{color:var(--dang);font-weight:600}

/* Table */
table{width:100%;border-collapse:collapse}
th{
  text-align:left;font-size:11.5px;font-weight:600;color:var(--txt-2);
  letter-spacing:.3px;padding:10px 14px;background:var(--bg);border-bottom:1px solid var(--line);
  white-space:nowrap;
}
td{padding:12px 14px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
tbody tr{transition:.12s;cursor:pointer}
tbody tr:hover{background:var(--blue-50)}
tbody tr:last-child td{border-bottom:none}
.tb-wrap{overflow-x:auto}

/* Chips */
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2.5px 9px;border-radius:20px;white-space:nowrap}
.c-blue{background:var(--blue-50);color:var(--blue)}
.c-ok{background:var(--ok-bg);color:var(--ok)}
.c-warn{background:var(--warn-bg);color:var(--warn)}
.c-dang{background:var(--dang-bg);color:var(--dang)}
.c-pur{background:var(--purple-bg);color:var(--purple)}
.c-gray{background:#EEF1F6;color:var(--txt-2)}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:5px;background:var(--bg);border:1px solid var(--line);color:var(--txt-2);margin:1.5px 3px 1.5px 0;white-space:nowrap}
.tag.hi{background:var(--blue-50);border-color:#C9D9F5;color:var(--blue)}

.pers{display:flex;align-items:center;gap:10px}
.pers .ava{width:34px;height:34px;font-size:12px;flex-shrink:0}
.pers b{display:block;font-size:13.5px;font-weight:600;line-height:1.35}
.pers span{display:block;font-size:11.5px;color:var(--txt-3)}

/* Filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.fl{
  height:32px;border:1px solid var(--line);background:#fff;border-radius:8px;
  padding:0 10px;font-size:12.5px;color:var(--txt);outline:none;
}
.fl:focus{border-color:var(--blue)}
.pill{height:30px;padding:0 12px;border-radius:20px;border:1px solid var(--line);background:#fff;font-size:12.5px;font-weight:500;color:var(--txt-2)}
.pill:hover{border-color:var(--blue-l)}
.pill.on{background:var(--blue);color:#fff;border-color:var(--blue)}

/* Kanban */
.kb{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;align-items:flex-start}
.kb-col{flex:0 0 258px;background:#EFF3F9;border-radius:10px;padding:10px;min-height:180px;transition:.15s}
.kb-col.over{background:#DDE8FA;box-shadow:inset 0 0 0 2px var(--blue-l)}
.kb-h{display:flex;align-items:center;gap:7px;padding:2px 4px 10px;font-size:12.5px;font-weight:700;color:var(--txt)}
.kb-dot{width:8px;height:8px;border-radius:50%}
.kb-h .n{margin-left:auto;font-size:11px;background:#fff;color:var(--txt-2);padding:1px 8px;border-radius:20px;font-weight:600;border:1px solid var(--line)}
.kb-card{
  background:#fff;border:1px solid var(--line);border-radius:8px;padding:11px;
  margin-bottom:8px;cursor:grab;box-shadow:0 1px 2px rgba(13,27,42,.05);transition:.15s;
}
.kb-card:hover{border-color:var(--blue-l);box-shadow:0 3px 10px rgba(36,70,168,.1)}
.kb-card.drag{opacity:.4;cursor:grabbing}
.kb-card b{font-size:13px;font-weight:600;display:block}
.kb-card .jb{font-size:11.5px;color:var(--txt-2);margin-top:2px}
.kb-card .mt{display:flex;align-items:center;gap:6px;margin-top:9px;font-size:11px;color:var(--txt-3)}
.kb-card .mt .ava{width:20px;height:20px;font-size:9px}
.kb-card .fee{margin-left:auto;font-weight:700;color:var(--ok);font-size:11.5px}

/* Upload */
.drop{
  border:2px dashed var(--line-2);border-radius:12px;padding:36px 20px;text-align:center;
  background:var(--bg);transition:.2s;
}
.drop:hover{border-color:var(--blue);background:var(--blue-50)}
.drop svg{width:38px;height:38px;color:var(--blue-l);margin-bottom:10px}
.drop b{display:block;font-size:14.5px;font-weight:600}
.drop p{font-size:12.5px;color:var(--txt-2);margin-top:4px}
.btn{
  height:36px;padding:0 16px;border-radius:8px;background:var(--blue);color:#fff;
  font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:.15s;
}
.btn:hover{background:var(--blue-d)}
.btn.gh{background:#fff;color:var(--txt);border:1px solid var(--line)}
.btn.gh:hover{background:var(--bg)}
.btn.sm{height:30px;padding:0 12px;font-size:12.5px}
.btn svg{width:15px;height:15px}
.btn:disabled{opacity:.5;cursor:not-allowed}

.prog{height:6px;background:var(--line);border-radius:10px;overflow:hidden;margin:14px 0 8px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--blue-l));width:0;transition:width .4s ease;border-radius:10px}
.steps{font-size:12.5px;color:var(--txt-2)}
.steps div{padding:3px 0;display:flex;align-items:center;gap:7px;opacity:.35;transition:.3s}
.steps div.on{opacity:1;color:var(--txt)}
.steps div.on b{color:var(--ok)}
.steps div svg{width:14px;height:14px}
.mini svg{width:13px;height:13px;vertical-align:-2px;opacity:.6}

.fld{margin-bottom:12px}
.fld label{display:block;font-size:11.5px;font-weight:600;color:var(--txt-2);margin-bottom:4px}
.fld .v{
  border:1px solid var(--line);border-radius:7px;padding:8px 11px;background:#fff;font-size:13px;min-height:36px;
}
.fld .v.auto{background:#F0F7F3;border-color:#B8E4D0}
.auto-mk{font-size:10px;color:var(--ok);font-weight:700;margin-left:6px}

/* Resume preview */
.rz{display:grid;grid-template-columns:270px 1fr;gap:18px}
@media(max-width:1000px){.rz{grid-template-columns:1fr}}
.tog{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}
.tog:last-child{border-bottom:none}
.tog span{font-size:13px}
.tog small{display:block;font-size:11px;color:var(--txt-3)}
.sw{width:38px;height:21px;background:var(--line-2);border-radius:20px;position:relative;transition:.2s;flex-shrink:0}
.sw::after{content:'';position:absolute;top:2.5px;left:2.5px;width:16px;height:16px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on{background:var(--blue)}
.sw.on::after{transform:translateX(17px)}
.doc{
  background:#fff;border:1px solid var(--line);border-radius:8px;padding:32px 36px;
  box-shadow:0 2px 12px rgba(13,27,42,.07);font-size:12.5px;line-height:1.75;
}
.doc-hd{display:flex;align-items:center;gap:12px;padding-bottom:14px;border-bottom:2px solid var(--blue);margin-bottom:18px}
.doc-hd .lg{width:34px;height:34px;border-radius:7px;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.doc-hd b{font-size:14px;display:block}
.doc-hd span{font-size:10.5px;color:var(--txt-3);letter-spacing:.6px}
.doc h2{font-size:19px;font-weight:700;letter-spacing:-.3px}
.doc .sub{color:var(--txt-2);font-size:12.5px;margin-top:1px}
.doc h4{font-size:11.5px;font-weight:700;color:var(--blue);letter-spacing:.8px;margin:20px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.doc ul{padding-left:17px;margin:5px 0}
.doc li{margin-bottom:3px}
.exp{margin-bottom:13px}
.exp .r1{display:flex;justify-content:space-between;gap:10px}
.exp .r1 b{font-size:13px}
.exp .r1 i{font-style:normal;font-size:11.5px;color:var(--txt-3);white-space:nowrap}
.exp .r2{font-size:12px;color:var(--txt-2)}
.msk{background:#3A4A61;color:transparent;border-radius:3px;user-select:none;padding:0 2px}
.msk-t{background:#EEF1F6;color:var(--txt-3);border-radius:3px;padding:0 5px;font-size:11.5px;letter-spacing:.5px}

/* Timeline */
.tl{position:relative;padding-left:22px}
.tl::before{content:'';position:absolute;left:6px;top:5px;bottom:5px;width:2px;background:var(--line)}
.tl-i{position:relative;padding-bottom:16px}
.tl-i::before{content:'';position:absolute;left:-21px;top:5px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--blue-l)}
.tl-i.hi::before{background:var(--blue);border-color:var(--blue)}
.tl-i .dt{font-size:11px;color:var(--txt-3);font-weight:500}
.tl-i b{font-size:13px;display:block;margin-top:1px}
.tl-i p{font-size:12.5px;color:var(--txt-2);margin-top:2px}

/* Chart */
.bars{display:flex;align-items:flex-end;gap:12px;height:196px;padding-top:10px}
.bar-c{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;height:100%;justify-content:flex-end}
.bar-st{width:100%;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;height:100%}
.bar{border-radius:4px 4px 0 0;transition:.4s;min-height:3px}
.bar-lb{font-size:11px;color:var(--txt-2);font-weight:500}
.lgd{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.lgd i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px}
.lgd span{font-size:11.5px;color:var(--txt-2);display:flex;align-items:center}

.fnl{display:flex;flex-direction:column;gap:5px}
.fnl-r{display:flex;align-items:center;gap:12px}
.fnl-lb{width:74px;font-size:12px;color:var(--txt-2);text-align:right;flex-shrink:0}
.fnl-b{height:34px;border-radius:6px;display:flex;align-items:center;padding:0 11px;color:#fff;font-size:12.5px;font-weight:600;transition:.5s;min-width:52px}
.fnl-rt{font-size:11.5px;color:var(--txt-3);flex-shrink:0}

/* Modal */
.mask{position:fixed;inset:0;background:rgba(13,27,42,.5);backdrop-filter:blur(2px);z-index:100;display:none;align-items:center;justify-content:center;padding:24px}
.mask.on{display:flex}
.modal{background:#fff;border-radius:12px;max-width:780px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(13,27,42,.3)}
.modal-h{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;position:sticky;top:0;background:#fff;border-radius:12px 12px 0 0;z-index:2}
.modal-h .sp{flex:1}
.x{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:var(--txt-3);font-size:19px}
.x:hover{background:var(--bg)}
.modal-b{padding:22px}

.note{background:var(--warn-bg);border:1px solid #F5D9A8;border-radius:8px;padding:11px 14px;font-size:12.5px;color:#8A5A08;display:flex;gap:9px}
.note svg{width:16px;height:16px;flex-shrink:0;margin-top:1px}
.note.b{background:var(--blue-50);border-color:#C9D9F5;color:var(--blue-d)}

.dbanner{
  background:linear-gradient(135deg,var(--ink) 0%,var(--ink-3) 100%);color:#fff;
  padding:9px 24px;font-size:12.5px;display:flex;align-items:center;gap:10px;
}
.dbanner b{background:rgba(255,255,255,.15);padding:1.5px 8px;border-radius:20px;font-size:11px;letter-spacing:.5px}
.dbanner span{color:#B9C9DE}
.dbanner .sp{flex:1}
.dbanner a{color:#fff;font-weight:600;border-bottom:1px solid rgba(255,255,255,.4);padding-bottom:1px}

.empty{padding:44px 20px;text-align:center;color:var(--txt-3)}
.empty svg{width:40px;height:40px;margin-bottom:10px;opacity:.5}
.mini{font-size:11.5px;color:var(--txt-3)}
.bar-mini{height:5px;background:var(--line);border-radius:10px;overflow:hidden;margin-top:5px;width:110px}
.bar-mini i{display:block;height:100%;background:var(--blue);border-radius:10px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;padding:11px 20px;border-radius:9px;font-size:13px;font-weight:500;z-index:200;transition:.3s;opacity:0;box-shadow:0 8px 24px rgba(13,27,42,.3)}
.toast.on{transform:translateX(-50%) translateY(0);opacity:1}
</style>
</head>
<body>

<div class="dbanner">
  <b>DEMO</b>
  <span>這是 JOINJOY 獵頭後台的互動原型，資料皆為虛構示意。可切換左下角角色看權限差異、拖拉案件卡片、上傳履歷試自動解析。</span>
  <div class="sp"></div>
  <span>奧科希 AEL 製作</span>
</div>

<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="brand-mk">JJ</div>
      <div class="brand-tx"><b>JOINJOY</b><span>Talent OS</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-ft">
      <div class="role-box">
        <label>切換身分（權限分層）</label>
        <select id="roleSel"></select>
        <div class="role-hint" id="roleHint"></div>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="top">
      <div class="search">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="gsearch" placeholder="搜尋候選人、職缺、客戶⋯⋯（試試「半導體」或「Python」）">
      </div>

function bindKanban(){
  drawCards();
  document.querySelectorAll('.kb-col').forEach(col=>{
    col.addEventListener('dragover',e=>{e.preventDefault();col.classList.add('over')});
    col.addEventListener('dragleave',()=>col.classList.remove('over'));
    col.addEventListener('drop',e=>{
      e.preventDefault();col.classList.remove('over');
      const id=+e.dataTransfer.getData('id');const c=CASES.find(x=>x.id===id);
      const ns=col.dataset.st;
      if(c&&c.st!==ns){const old=STAGES.find(s=>s.k===c.st).t;c.st=ns;c.day=0;drawCards();
        toast(`${c.n}：${old} → ${STAGES.find(s=>s.k===ns).t}　已記錄異動`);}
    });
  });
}
function drawCards(){
  const all=R().see.allData?CASES:CASES.filter(c=>c.own===R().name);
  STAGES.forEach(s=>{
    const list=all.filter(c=>c.st===s.k);
    document.querySelector(`.kb-body[data-st="${s.k}"]`).innerHTML=list.map(c=>`
      <div class="kb-card" draggable="true" data-id="${c.id}" onclick="openCase(${c.id})">

  });
}

function runParse(){

    <div class="grid g4" style="gap:12px;margin-bottom:18px">
      ${[['服務費率',ct?c.fee:'—'],['保證期',ct?c.guar:'—'],['付款條件',ct?c.pay:'—'],['累計成交',c.deal+' 人']]
      .map(x=>`<div style="background:var(--bg);border-radius:8px;padding:11px 13px"><div class="mini">${x[0]}</div><b style="font-size:14px">${x[1]}</b></div>`).join('')}</div>
    <div class="fld"><label>主要窗口</label><div class="v">${c.pic}　${c.ph}</div></div>
    <div class="fld"><label>在案職缺</label><div class="v">${JOBS.filter(j=>j.c===c.n.slice(0,5)||c.n.includes(j.c.slice(0,4))).map(j=>`<span class="tag hi">${j.t}</span>`).join('')||'<span class="mini">目前無在案職缺</span>'}</div></div>
    ${ct?`<div class="fld"><label>累計服務費收入</label><div class="v"><b style="font-size:16px;color:var(--ok)">${c.rev}</b></div></div>`:''}
    <div style="display:flex;gap:8px;margin-top:8px"><button class="btn" onclick="toast('已記錄拜訪紀錄（Demo）')">+ 拜訪紀錄</button>
      <button class="btn gh" onclick="closeM()">關閉</button></div></div>`);
}

/* ============ 啟動 ============ */
$('#roleSel').innerHTML=Object.entries(ROLES).map(([k,r])=>`<option value="${k}">${r.name}（${r.title}）</option>`).join('');
$('#roleSel').onchange=e=>setRole(e.target.value);
$('#roleHint').textContent=ROLES.admin.hint;
$('#gsearch').addEventListener('keydown',e=>{if(e.key==='Enter'){go('talents');setTimeout(()=>{const i=document.querySelector('.filters input');if(i){i.value=e.target.value;filterT(e.target.value)}},60)}});
drawNav();go('dash');
</script>
</body>
</html>
